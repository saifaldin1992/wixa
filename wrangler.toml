# ─────────────────────────────────────────────────────────────
#  WIXA — two environments
#   production : wixa.dev         ← branch `main`     (npx wrangler deploy)
#   staging    : staging.wixa.dev ← branch `staging`  (npx wrangler deploy --env staging)
#  Each has its own Supabase project. Only public (publishable) keys live here.
#  Secrets set on each Worker (never in git): WRITE_TOKEN, VISITOR_SALT,
#  TURNSTILE_SECRET, RESEND_API_KEY, NOTIFY_EMAIL, CF_ANALYTICS_TOKEN.
# ─────────────────────────────────────────────────────────────
name = "wixa"
main = "src/index.js"
compatibility_date = "2026-10-01"

# ---------- production (top-level keys must come before any [table]) ----------
workers_dev = true
routes = [
  { pattern = "wixa.dev", custom_domain = true },
  { pattern = "www.wixa.dev", custom_domain = true },
]

# Static site (public/) is served first; these paths go to the Worker.
# the developer guide (docs/DEVELOPERS.md) is bundled as text and shown only inside the dashboard
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[build]
command = "node scripts/build.mjs"
watch_dir = ["public/js", "public/admin/js", "public/admin/admin.js", "public/admin/admin.css", "public/styles.css", "public/shared.js"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html", "/build/*", "/admin/", "/admin/index.html", "/projects/*", "/services/*", "/blog", "/blog/*", "/review", "/privacy", "/about", "/pricing", "/careers", "/contact", "/faq", "/order", "/unsubscribe", "/api/*", "/health", "/robots.txt", "/sitemap.xml"]

# Abuse protection: per-IP limits, counted per Cloudflare location.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "TRACK_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# private settings only the server reads (e.g. where new-message alerts go)
[[kv_namespaces]]
binding = "PRIVATE"
id = "16bfe7325d144e87a3fe12e9a6cbd744"

# scheduled jobs: health check every 15 minutes, weekly report on Sunday 09:17 Baghdad (06:17 UTC),
# backup check every day 06:23 Baghdad (sent daily, weekly on Sunday or monthly on the 1st, as set in the dashboard)
[triggers]
crons = ["*/15 * * * *", "17 6 * * SUN", "23 3 * * *"]

# deploy id and time, shown on the dashboard's Connections page
[version_metadata]
binding = "CF_VERSION"

[vars]
SITE_ENV = "production"
CF_ACCOUNT_ID = "1816dc735005fa354d10dfef69ac1450"
CF_SITE_TAG = "a4d140ea04cf4d6f8cb3117d66cb91e8"
# Production: Cloudflare injects the Web Analytics beacon automatically (zone rule: host wixa.dev),
# so the Worker adds none here. Staging is excluded from that rule and uses its own site below.
CF_BEACON_TOKEN = ""
TURNSTILE_SITE_KEY = "0x4AAAAAAF18CPavg0KnYszj"
SUPABASE_URL = "https://sdtsoppvyogdfamotrvx.supabase.co" # Frankfurt (moved from Seoul, Nov 2026)
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_5Hc_PPGOyJYJb0MMZlvLQA_t4p7ijOW"

# ---------- staging ----------
[env.staging]
name = "wixa-staging"
workers_dev = true
routes = [
  { pattern = "staging.wixa.dev", custom_domain = true },
]

# the test copy runs no scheduled jobs (the weekly report can still be sent from its dashboard)
[env.staging.triggers]
crons = []

[[env.staging.ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "TRACK_LIMITER"
namespace_id = "2002"
simple = { limit = 30, period = 60 }

[[env.staging.kv_namespaces]]
binding = "PRIVATE"
id = "1dc19bbb96cb4834af33d9b2c90e86a6"

[env.staging.version_metadata]
binding = "CF_VERSION"

[env.staging.vars]
SITE_ENV = "staging"
CF_ACCOUNT_ID = "1816dc735005fa354d10dfef69ac1450"
CF_SITE_TAG = "57a74dffd4314b11ab3d247957199494"
