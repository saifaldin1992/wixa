# ─────────────────────────────────────────────────────────────
#  WIXA — two environments
#   production : wixa.dev         ← branch `main`     (npx wrangler deploy)
#   staging    : staging.wixa.dev ← branch `staging`  (npx wrangler deploy --env staging)
#  Each has its own Supabase project. Only public (publishable) keys live here.
#  Secrets set on each Worker (never in git): WRITE_TOKEN, VISITOR_SALT,
#  TURNSTILE_SECRET, RESEND_API_KEY, NOTIFY_EMAIL, CF_ANALYTICS_TOKEN.
# ─────────────────────────────────────────────────────────────
name = "wixa"
main = "src/index.js"
compatibility_date = "2026-10-01"

# ---------- production (top-level keys must come before any [table]) ----------
workers_dev = true
routes = [
  { pattern = "wixa.dev", custom_domain = true },
  { pattern = "www.wixa.dev", custom_domain = true },
]

# Static site (public/) is served first; these paths go to the Worker.
[build]
command = "node scripts/build.mjs"
watch_dir = ["public/js", "public/admin/js", "public/admin/admin.js", "public/admin/admin.css", "public/styles.css", "public/shared.js"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/index.html", "/api/*", "/health", "/robots.txt", "/sitemap.xml"]

# Abuse protection: per-IP limits, counted per Cloudflare location.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "TRACK_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[vars]
SITE_ENV = "production"
CF_ACCOUNT_ID = "1816dc735005fa354d10dfef69ac1450"
CF_SITE_TAG = "a4d140ea04cf4d6f8cb3117d66cb91e8"
# Production: Cloudflare injects the Web Analytics beacon automatically (zone rule: host wixa.dev),
# so the Worker adds none here. Staging is excluded from that rule and uses its own site below.
CF_BEACON_TOKEN = ""
TURNSTILE_SITE_KEY = "0x4AAAAAAF18CPavg0KnYszj"
SUPABASE_URL = "https://oswetqychjhfrwulzkjy.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_m6oe17fpFQvF1huyQ_8U_g_4NLmHiAm"

# ---------- staging ----------
[env.staging]
name = "wixa-staging"
workers_dev = true
routes = [
  { pattern = "staging.wixa.dev", custom_domain = true },
]

[[env.staging.ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "TRACK_LIMITER"
namespace_id = "2002"
simple = { limit = 30, period = 60 }

[env.staging.vars]
SITE_ENV = "staging"
CF_ACCOUNT_ID = "1816dc735005fa354d10dfef69ac1450"
CF_SITE_TAG = "57a74dffd4314b11ab3d247957199494"
CF_BEACON_TOKEN = "3e0bde0c61e7495d904b8bdd01e51da0"
TURNSTILE_SITE_KEY = "0x4AAAAAAF18CPavg0KnYszj"
SUPABASE_URL = "https://zwusczwhlshdgnoyesde.supabase.co"
