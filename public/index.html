<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIXA — ويكسا</title>
  <meta name="description" content="ويكسا: نصمم ونطور منصات وتطبيقات وأنظمة رقمية من الفكرة حتى التشغيل.">
  <meta name="theme-color" content="#F5F7FB">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F5BFF'/%3E%3Cpath d='M14 20l7 24 11-17 11 17 7-24' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <script src="/shared.js"></script>
</head>
<body class="is-loading">

  <div class="loader" aria-hidden="true"><div class="loader__mark"><svg viewBox="0 0 64 40"><path d="M4 6l10 28 14-22 14 22 10-28"/></svg></div></div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header__bar">
      <a href="#top" class="brand" aria-label="WIXA">
        <span class="brand__mark" id="brandMark"><svg viewBox="0 0 64 40" aria-hidden="true"><path d="M4 6l10 28 14-22 14 22 10-28"/></svg></span>
        <span class="brand__name" data-t="brand"></span>
      </a>
      <nav class="header__nav" aria-label="main">
        <a href="#top" data-t="nav_home"></a>
        <a href="#projects" data-t="nav_projects" data-sec="projects"></a>
        <a href="#services" data-t="nav_services" data-sec="services"></a>
        <a href="#partners" data-t="nav_partners" data-sec="partners"></a>
        <a href="#contact" data-t="nav_contact" data-sec="contact"></a>
      </nav>
      <div class="header__end">
        <button class="pill-btn lang-btn" id="langBtn" type="button"></button>
        <button class="menu-btn" id="menuBtn" type="button" aria-label="menu" aria-expanded="false"><span></span><span></span></button>
      </div>
    </div>
    <div class="header__menu" id="menu">
      <a href="#top" data-t="nav_home"></a>
      <a href="#projects" data-t="nav_projects" data-sec="projects"></a>
      <a href="#services" data-t="nav_services" data-sec="services"></a>
      <a href="#partners" data-t="nav_partners" data-sec="partners"></a>
      <a href="#contact" data-t="nav_contact" data-sec="contact"></a>
    </div>
  </header>
  <div class="scrim" id="scrim"></div>

  <main id="top">
    <!-- Hero -->
    <section class="hero">
      <div class="hero__bg" aria-hidden="true">
        <svg class="net" id="net" viewBox="0 0 800 700" preserveAspectRatio="xMidYMid slice"></svg>
      </div>
      <div class="hero__content">
        <span class="badge reveal-up"><i class="pulse"></i><span data-c="hero_badge"></span></span>
        <h1 class="hero__title" id="heroTitle" data-c="hero_title"></h1>
        <p class="hero__sub reveal-up" data-c="hero_sub"></p>
        <div class="hero__ctas reveal-up">
          <a href="#projects" class="btn btn--primary magnetic"><span data-c="hero_cta"></span><svg class="arr" viewBox="0 0 24 24"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg></a>
          <a href="#contact" class="btn btn--ghost"><span data-c="hero_cta2"></span></a>
        </div>
      </div>
      <a href="#story" class="hero__scroll" aria-label="scroll"><span></span></a>
    </section>

    <!-- Story -->
    <section class="story" id="story" data-section="story">
      <div class="story__list" id="storyList"></div>
    </section>

    <!-- Projects -->
    <section class="projects" id="projects" data-section="projects">
      <div class="head">
        <h2 class="head__title reveal-up" data-c="projects_title"></h2>
        <p class="head__sub reveal-up" data-c="projects_sub"></p>
      </div>
      <div class="projects__list" id="projectsList"></div>
    </section>

    <!-- Services -->
    <section class="services" id="services" data-section="services">
      <div class="head">
        <h2 class="head__title reveal-up" data-c="services_title"></h2>
        <p class="head__sub reveal-up" data-c="services_sub"></p>
      </div>
      <div class="services__grid" id="servicesGrid"></div>
    </section>

    <!-- Stats -->
    <section class="stats" data-section="stats">
      <div class="stats__inner">
        <h2 class="stats__title reveal-up" data-c="stats_title"></h2>
        <div class="stats__grid" id="statsGrid"></div>
      </div>
    </section>

    <!-- Partners -->
    <section class="partners" id="partners" data-section="partners">
      <div class="head">
        <h2 class="head__title reveal-up" data-c="partners_title"></h2>
        <p class="head__sub reveal-up" data-c="partners_sub"></p>
      </div>
      <div class="partners__grid" id="partnersGrid"></div>
    </section>

    <!-- CTA + Contact -->
    <section class="cta" id="contact" data-section="contact">
      <div class="cta__glow" aria-hidden="true"></div>
      <h2 class="cta__title reveal-up" data-c="cta_title"></h2>
      <p class="cta__sub reveal-up" data-c="cta_sub"></p>
      <div class="cta__actions reveal-up">
        <a class="icon-btn" id="ctaPhone" href="#" aria-label="phone"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg></a>
        <button class="btn btn--primary magnetic" id="openForm" type="button"><span data-c="cta_button"></span><svg class="arr" viewBox="0 0 24 24"><path d="M19 12H5m0 0l6-6m-6 6l6 6"/></svg></button>
      </div>

      <form class="form" id="contactForm" novalidate>
       <div class="form__inner">
        <div class="form__grid">
          <label class="field"><span data-t="f_name"></span><input name="name" required maxlength="120" autocomplete="name"></label>
          <label class="field"><span data-t="f_email"></span><input name="email" type="email" required maxlength="200" autocomplete="email" dir="ltr"></label>
          <label class="field"><span data-t="f_phone"></span><input name="phone" type="tel" maxlength="40" autocomplete="tel" dir="ltr"></label>
          <label class="field"><span data-t="f_service"></span><select name="service" id="serviceSelect"></select></label>
          <label class="field field--full"><span data-t="f_message"></span><textarea name="message" required maxlength="4000" rows="4"></textarea></label>
        </div>
        <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="form__end">
          <p class="form__status" id="formStatus" role="status"></p>
          <button class="btn btn--primary" type="submit"><span data-t="f_send"></span></button>
        </div>
       </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <div class="footer__top">
      <a href="#top" class="brand"><span class="brand__mark"><svg viewBox="0 0 64 40"><path d="M4 6l10 28 14-22 14 22 10-28"/></svg></span><span class="brand__name" data-t="brand"></span></a>
      <nav class="footer__nav">
        <a href="#top" data-t="nav_home"></a>
        <a href="#projects" data-t="nav_projects" data-sec="projects"></a>
        <a href="#partners" data-t="nav_partners" data-sec="partners"></a>
        <a href="#contact" data-t="nav_contact" data-sec="contact"></a>
      </nav>
    </div>
    <div class="footer__bottom">
      <div class="footer__social" id="social"></div>
      <button class="footer__lang" id="langBtn2" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg><span></span></button>
      <p class="footer__credit"><span data-c="footer_text"></span> · © <span id="year"></span></p>
    </div>
  </footer>

  <a class="wa" id="wa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp" hidden>
    <svg viewBox="0 0 32 32"><path fill="currentColor" d="M16 3a13 13 0 00-11.2 19.6L3 29l6.6-1.7A13 13 0 1016 3zm0 23.6a10.6 10.6 0 01-5.4-1.5l-.4-.2-3.9 1 1-3.8-.2-.4A10.6 10.6 0 1116 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 01-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6a1.2 1.2 0 00-.9.4 3.7 3.7 0 00-1.2 2.8 6.5 6.5 0 001.4 3.4 14.8 14.8 0 005.7 5c2.1.9 2.9 1 4 .8a3.4 3.4 0 002.2-1.6 2.8 2.8 0 00.2-1.6c-.1-.1-.3-.2-.6-.4z"/></svg>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
  <script src="/main.js" defer></script>
</body>
</html>
